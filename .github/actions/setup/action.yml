name: Setup
description: Install pnpm, Node.js and the workspace dependencies.

inputs:
  node-version:
    description: Node.js version to install.
    default: "24"
  install-args:
    description: Extra arguments for pnpm install, such as a workspace filter.
    default: ""

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: "pnpm"

    - name: Install dependencies
      shell: bash
      run: pnpm ${{ inputs.install-args }} install --frozen-lockfile
