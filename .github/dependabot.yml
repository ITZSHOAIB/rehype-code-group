version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # Matches minimumReleaseAge in pnpm-workspace.yaml (4320 minutes)
    cooldown:
      default-days: 3
    groups:
      non-major:
        update-types:
          - "patch"
          - "minor"
      major:
        update-types:
          - "major"
